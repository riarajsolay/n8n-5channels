services:
  - type: web
    name: n8n-5channels
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: N8N_HOST
        value: n8n-5channels.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-5channels.onrender.com/
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-5channels.onrender.com
      - key: N8N_SECURE_COOKIE
        value: false
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: N8N_BASIC_AUTH_ACTIVE
        value: false

  - type: web
    name: telugu-video-api
    env: docker
    dockerfilePath: ./Dockerfile.videoapi
    plan: free
    healthCheckPath: /health
