services:
  - type: web
    name: n8n-5channels-free
    env: docker
    plan: free
    dockerCommand: n8n start
    dockerContext: .
    envVars:
      - key: N8N_PORT
        value: 10000
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: n8n-5channels-free.onrender.com
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-5channels-free.onrender.com
      - key: WEBHOOK_URL
        value: https://n8n-5channels-free.onrender.com
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: N8N_ENCRYPTION_KEY
        value: riarajstore-21-free-key-12345
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        value: raj
      - key: N8N_BASIC_AUTH_PASSWORD
        value: riarajstore21
    healthCheckPath: /healthz